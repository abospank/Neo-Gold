name: Publish AION TV GOLD Android v76
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-aion-android-v76.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download and verify original v76 APK
        env:
          SIGNED_URL_B64: 
        run: |
          python - <<'PY'
          import base64, hashlib, os, urllib.request
          url = base64.b64decode(os.environ['SIGNED_URL_B64']).decode()
          path = 'AION-TV-GOLD-v1.0-LOGIN-REFERENCE-v76.apk'
          urllib.request.urlretrieve(url, path)
          digest = hashlib.sha256(open(path,'rb').read()).hexdigest()
          assert os.path.getsize(path) == 62077831, 'APK size mismatch'
          assert digest == '4c2583ccb266d8f516415998d19b845723808da43d05186bcb18be655d12dd9c', 'APK SHA256 mismatch'
          print('Verified exact Android v76 APK', os.path.getsize(path), digest)
          PY
      - name: Publish working public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create aion-tv-gold-android-v76 AION-TV-GOLD-v1.0-LOGIN-REFERENCE-v76.apk --repo abospank/Neo-Gold --title 'AION TV GOLD Android v76' --notes 'Exact AION TV GOLD v1.0 LOGIN REFERENCE v76 APK. SHA256: 4c2583ccb266d8f516415998d19b845723808da43d05186bcb18be655d12dd9c' --latest=false
