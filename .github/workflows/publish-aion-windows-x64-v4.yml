name: Publish AION TV GOLD Windows x64 v4 download
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-aion-windows-x64-v4.yml']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download and package Windows x64 only
        env:
          SIGNED_URL_B64: 
        run: |
          python3 - <<'PY'
          import base64, os, shutil, urllib.request, zipfile
          url=base64.b64decode(os.environ['SIGNED_URL_B64']).decode().strip()
          with urllib.request.urlopen(url, timeout=60) as response, open('original.zip','wb') as out:
              shutil.copyfileobj(response,out)
          dest='AION-TV-GOLD-Windows-x64-v4.zip'
          with zipfile.ZipFile('original.zip') as source, zipfile.ZipFile(dest,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9,allowZip64=True) as target:
              for entry in source.infolist():
                  if entry.filename.startswith(('libvlc/win-x86/','libvlc/win-arm64/')): continue
                  target.writestr(entry,source.read(entry.filename))
          with zipfile.ZipFile(dest) as check:
              assert check.testzip() is None
              names=check.namelist()
              assert 'AION-TV-GOLD.exe' in names
              assert any(x.startswith('libvlc/win-x64/') for x in names)
              assert not any(x.startswith(('libvlc/win-x86/','libvlc/win-arm64/')) for x in names)
          assert 100000000 < os.path.getsize(dest) < 160000000
          print('Windows x64 ZIP verified, bytes:',os.path.getsize(dest))
          PY
      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create aion-tv-gold-windows-x64-v4 AION-TV-GOLD-Windows-x64-v4.zip --repo abospank/Neo-Gold --title 'AION TV GOLD Windows x64 v4' --notes 'Compiled Windows x64 package only. Extract the complete ZIP and run AION-TV-GOLD.exe. The x86 and ARM64 VLC binaries were removed from the verified native Windows x64 build; x64 playback dependencies remain. Build startup and mocked login were tested; live subscription playback needs testing on the subscriber network.' --latest=false
