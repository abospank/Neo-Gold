name: Export Android patch tools

on:
  push:
    branches: [temp-export-android-tools-20260923]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare tools
        shell: bash
        run: |
          set -e
          mkdir -p export/build-tools
          curl -fL --retry 4 --retry-delay 2 https://github.com/iBotPeaches/Apktool/releases/download/v2.11.1/apktool_2.11.1.jar -o export/apktool.jar
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          cp "$BT/apksigner" export/build-tools/
          cp "$BT/zipalign" export/build-tools/
          mkdir -p export/build-tools/lib
          cp "$BT/lib/apksigner.jar" export/build-tools/lib/
          chmod +x export/build-tools/apksigner export/build-tools/zipalign
      - name: Upload tools
        uses: actions/upload-artifact@v4
        with:
          name: android-patch-tools
          path: export
          if-no-files-found: error
          retention-days: 1
