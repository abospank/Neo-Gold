name: Publish AION Windows x64 v6
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-aion-windows-x64-v6.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download private build and keep Windows x64 VLC
        env:
          SIGNED_URL_B64: 
        run: |
          python - <<'PY'
          import base64, os, urllib.request, zipfile
          url = base64.b64decode(os.environ['SIGNED_URL_B64']).decode()
          urllib.request.urlretrieve(url, 'native.zip')
          with zipfile.ZipFile('native.zip') as source, zipfile.ZipFile('AION-TV-GOLD-Windows-x64-v6.zip','w',zipfile.ZIP_DEFLATED,compresslevel=9) as dest:
              for member in source.infolist():
                  if member.filename.startswith(('libvlc/win-x86/','libvlc/win-arm64/')): continue
                  if member.is_dir(): continue
                  dest.writestr(member.filename,source.read(member))
          with zipfile.ZipFile('AION-TV-GOLD-Windows-x64-v6.zip') as package:
              assert package.testzip() is None
              names=set(package.namelist())
              assert 'AION-TV-GOLD.exe' in names
              assert any('win-x64/libvlc.dll' in n for n in names)
          print('Verified Windows x64 package',os.path.getsize('AION-TV-GOLD-Windows-x64-v6.zip'))
          PY
      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum AION-TV-GOLD-Windows-x64-v6.zip
          gh release create aion-tv-gold-windows-x64-v6 AION-TV-GOLD-Windows-x64-v6.zip --repo abospank/Neo-Gold --title 'AION TV GOLD Windows x64 v6' --notes 'Native Windows build with working live playback, full-screen video (F11 / Escape), and minimize / maximize / close buttons. Build, routing, layout and GUI startup verified. Unzip and run AION-TV-GOLD.exe.' --latest=false
