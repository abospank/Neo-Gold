name: Export Apktool
on:
  push:
    paths:
      - '.github/workflows/export-apktool.yml'
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Download apktool
        run: |
          curl -fL --retry 3 -o apktool_3.0.3.jar https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar
      - uses: actions/upload-artifact@v4
        with:
          name: apktool-3.0.3
          path: apktool_3.0.3.jar
