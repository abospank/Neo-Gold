name: Publish AION Android v74
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-aion-android-v74.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify exact APK
        env:
          SIGNED_URL_B64: 
        run: |
          python - <<'PY'
          import base64, hashlib, os, urllib.request, zipfile
          url = base64.b64decode(os.environ['SIGNED_URL_B64']).decode()
          target = 'AION-TV-GOLD-v1.0-LOGIN-REFERENCE-v74.apk'
          urllib.request.urlretrieve(url, target)
          data = open(target, 'rb').read()
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '6f2be63bddc185e98a2c268b6df066b2b7ef50343256fbf920ef6cf6af71f5a5', digest
          with zipfile.ZipFile(target) as apk:
              assert apk.testzip() is None
              assert 'AndroidManifest.xml' in apk.namelist()
          print('Verified original v74 APK', len(data), digest)
          PY
      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create aion-tv-gold-android-v74 AION-TV-GOLD-v1.0-LOGIN-REFERENCE-v74.apk --repo abospank/Neo-Gold --title 'AION TV GOLD Android v74' --notes 'Exact unchanged v74 LOGIN REFERENCE APK from the original private release. SHA256 6f2be63bddc185e98a2c268b6df066b2b7ef50343256fbf920ef6cf6af71f5a5.' --latest=false
