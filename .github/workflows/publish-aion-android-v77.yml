name: Publish AION Android v77
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-aion-android-v77.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download and verify tested APK
        env:
          SIGNED_URL_B64: 
        run: |
          python - <<'PY'
          import base64, hashlib, os, urllib.request, zipfile
          url = base64.b64decode(os.environ['SIGNED_URL_B64']).decode()
          target = 'AION-TV-GOLD-v1.0-MOVIE-SEARCH-v77.apk'
          urllib.request.urlretrieve(url, target)
          data = open(target, 'rb').read()
          digest = hashlib.sha256(data).hexdigest()
          assert digest == '50fdb914d07d94b9f5df642506e34f39177298555e50cc8acb72e1bc79479bdb', digest
          with zipfile.ZipFile(target) as apk:
              assert apk.testzip() is None
              assert 'AndroidManifest.xml' in apk.namelist()
          print('Verified tested v77 APK', len(data), digest)
          PY
      - name: Publish public download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create aion-tv-gold-android-v77 AION-TV-GOLD-v1.0-MOVIE-SEARCH-v77.apk --repo abospank/Neo-Gold --title 'AION TV GOLD Android v77 - Movie search' --notes 'Verified v77 APK built from v76. Movie search field matches the existing series search style and dimensions in all density layouts. Login startup passed Android 29 emulator. SHA256 50fdb914d07d94b9f5df642506e34f39177298555e50cc8acb72e1bc79479bdb.' --latest=false
